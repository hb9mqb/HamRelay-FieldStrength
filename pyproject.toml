[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hamrelay-field-strength"
version = "0.1.0"
description = "Reproducible terrain-aware repeater field-strength maps, web overlays, and S-meter sampling"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Beat W. Meier" }]
keywords = ["radio-propagation", "ITU-R P.1812", "field-strength", "GIS", "amateur-radio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=2.1,<3",
  "Pillow>=11,<12",
  "pydantic>=2.10,<3",
  "pyproj>=3.7,<4",
  "rasterio>=1.4,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "Py1812 @ https://github.com/eeveetza/Py1812/archive/a5205e6a65db27391a8ba79bd5a365e5391f9fdf.tar.gz",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]
apple = ["mlx>=0.23,<1; platform_system == 'Darwin' and platform_machine == 'arm64'"]

[project.scripts]
hamrelay-field-strength = "hamrelay_field_strength.cli:main"

[project.urls]
Documentation = "https://github.com/coderplus007/HamRelay-FieldStrength#readme"
Issues = "https://github.com/coderplus007/HamRelay-FieldStrength/issues"
Source = "https://github.com/coderplus007/HamRelay-FieldStrength"

[tool.hatch.build.targets.wheel]
packages = ["src/hamrelay_field_strength"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
